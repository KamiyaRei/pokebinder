name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/i18n.js
          node --check scripts/prepare.cjs
          node --check tests/check.cjs
      - name: Validate dataset and collection behavior
        run: node tests/check.cjs --skip-images
