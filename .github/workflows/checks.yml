name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/binder-model.js
          node --check src/binder-ui.js
          node --check src/binder-i18n.js
          node --check src/card-tilt.js
          node --check src/app.js
          node --check src/i18n.js
          node --check src/tcg-catalog.js
          node --check src/card-picker.js
          node --check scripts/import-japanese.cjs
          node --check scripts/prepare.cjs
          node --check tests/check.cjs
      - name: Validate dataset and collection behavior
        run: node tests/check.cjs --skip-images
      - name: Validate card providers and Japanese database
        run: |
          node tests/binder-model.cjs
          node tests/card-tilt.cjs
          node tests/supplements.cjs
          node tests/catalog.cjs
          node tests/japanese-catalog.cjs
